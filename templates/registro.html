{# V — VISTA: el formulario de registro. Las reglas (edad, contraseña…) las revisa el Modelo. #}
{% extends "base.html" %}

{% block titulo %}Registro{% endblock %}

{% block contenido %}
    <h1>Crear cuenta</h1>

    <form id="form-registro" method="post">
        <label>Nombre
            <input type="text" name="nombre" maxlength="100" required value="{{ datos.get('nombre', '') }}">
        </label>
        <label>Correo
            <input type="email" name="correo" maxlength="150" required value="{{ datos.get('correo', '') }}">
        </label>
        <label>Sexo
            <select name="sexo" required>
                <option value="">Selecciona…</option>
                {% for opcion in sexos %}
                    <option {% if datos.get('sexo') == opcion %}selected{% endif %}>{{ opcion }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Edad
            <input type="number" name="edad" min="15" max="99" required value="{{ datos.get('edad', '') }}">
        </label>
        <label>Carrera
            <input type="text" name="carrera" maxlength="100" required value="{{ datos.get('carrera', '') }}">
        </label>
        <label>Contraseña
            <input type="password" name="password" minlength="8" required>
        </label>
        <label>Confirmar contraseña
            <input type="password" name="confirmar" minlength="8" required>
        </label>
        <button type="submit">Registrarme</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="{{ url_for('controlador.login') }}">Inicia sesión</a></p>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
